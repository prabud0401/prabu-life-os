# Project-scoped MCP for Grok CLI
# See knowledge/MCP-SETUP.md

[mcp_servers.outlook]
command = "node"
args = ["D:/BlueOcean main/blueocean_mcp/mcps/outlook/dist/index.js"]
enabled = true

[mcp_servers.teams]
command = "node"
args = ["D:/BlueOcean main/blueocean_mcp/mcps/teams/dist/index.js"]
enabled = true

[mcp_servers.gmail-local]
command = "node"
args = ["D:/tools/gmail-mcp-server/dist/index.js"]
enabled = true

[mcp_servers.prabu-life-os]
command = "node"
args = ["C:/Users/prabu/Desktop/prabu-life-os/packages/mcp/dist/index.js"]
enabled = true

# Remote cloud MCP (Railway) — requires PRABU_MCP_API_KEY in env
[mcp_servers.prabu-life-os-remote]
url = "https://prabu-life-os-production.up.railway.app/sse"
enabled = true

[mcp_servers.prabu-life-os-remote.headers]
Authorization = "Bearer ${PRABU_MCP_API_KEY}"
